name: Deploy backend

# PLATFORM ISOLATION: this repository must not ship traffic to Colombia.
# Jobs run only when ENABLE_PLATFORM_DEPLOYS is the string true.
# Do not copy Colombia Doppler tokens here.
# Isolated Worker: mallanet-platform-api (staging: mallanet-platform-api-staging).
#
# MANUAL (workflow_dispatch) desde 2026-08-11 por la tarde, decision del
# mantenedor tras el incidente de las 6h de 503: mergear a main ya NO
# despliega el backend de produccion por si solo. El historial completo:
# manual con confirmacion -> automatico en push (mañana del 2026-08-11) ->
# manual de nuevo (tarde, post-incidente). Staging conserva su deploy
# automatico (deploy-staging.yml): alli es donde se prueba; produccion se
# despliega mirando.
#
# Como desplegar:
#   Actions -> "Deploy backend" -> Run workflow (rama main)
#   o: gh workflow run deploy-backend.yml --ref main
#
# OJO CON EL REF: se despliega el codigo del ref que elijas, no el de `main`.
# Mergea a main ANTES de lanzarlo. Si lo lanzas sobre una rama y despues
# alguien lo lanza sobre main, el segundo pisa al primero en silencio y
# produccion se queda con el backend de main. Paso el 2026-08-10 (/api/pets
# volvio a dar 404 tras un despliegue aparentemente correcto). El estado sano
# es `main` == lo que corre en produccion.
#
# El gate de deriva de esquema corre igualmente en cada dispatch y falla
# cerrado: si el codigo espera columnas que produccion no tiene, no hay
# deploy. `omitir_drift` es la salida de emergencia auditada.
#
# OJO: las migraciones SIGUEN siendo un paso aparte y deliberado
# (backend/worker/migrate.ts contra Neon DIRECTO). Este workflow solo
# despliega codigo; nunca toca el esquema.
on:
  workflow_dispatch:
    inputs:
      omitir_drift:
        description: >-
          Saltar el gate de deriva de esquema. SOLO para un hotfix que no toca
          las tablas de la migracion pendiente. Queda registrado en Actions con
          tu usuario: es una decision visible, no un flag de conveniencia.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy de la API
    if: ${{ vars.ENABLE_PLATFORM_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # GATE DE DERIVA — corre ANTES del deploy, a proposito.
      #
      # El 2026-08-11 este workflow desplegó el codigo del formulario ramificado
      # de voluntarios mientras su migracion 0003 seguia sin aplicar: 6h de 503
      # en TODOS los registros publicos y ~44 inscripciones perdidas. El smoke
      # check de mas abajo dio verde todo el rato, porque /api/readyz hace
      # SELECT 1 y eso pasa con el esquema derivado.
      #
      # Corre antes y falla cerrado: si la base no tiene las columnas que el
      # codigo nuevo va a nombrar, NO se despliega y produccion se queda
      # sirviendo el codigo anterior, que si casa con el esquema anterior.
      # Fallar el deploy es estrictamente mejor que desplegar y romper.
      #
      # Compara COLUMNAS contra information_schema, no el contador de
      # migraciones (ver worker/check-schema-drift.ts). No escribe nada y NO
      # aplica migraciones: el gate humano de CLAUDE.md sigue intacto.
      #
      # Salida de emergencia: Actions -> Run workflow -> omitir_drift. Hay que
      # marcarla a mano en el formulario y queda con nombre y hora en el
      # historial: nadie se la salta sin dejar rastro.
      - name: Gate de deriva de esquema
        if: ${{ inputs.omitir_drift != true }}
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --command 'npm run check:schema-drift'

      - name: Aviso de gate omitido
        if: ${{ inputs.omitir_drift == true }}
        run: |
          echo "::warning title=Gate de deriva OMITIDO::Se despliega sin comprobar el esquema. Verifica que este hotfix no toca las tablas de ninguna migracion pendiente."

      # OJO: las migraciones NO corren aqui. Son un paso aparte y deliberado
      # (backend/worker/migrate.ts con DATABASE_URL apuntando a Neon DIRECTO,
      # no al endpoint -pooler). Encadenarlas a cada deploy significaria migrar
      # el esquema de produccion sin que nadie lo mire.
      - name: Deploy a Cloudflare Workers
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --command 'npx wrangler deploy'

      - name: Smoke check de la API
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://api.mallanet.org/api/readyz || echo 000)
            echo "intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "La API no devolvio 200 tras el despliegue"
          exit 1

  ops:
    name: Mallanet production control plane
    if: ${{ vars.ENABLE_PLATFORM_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ops/package-lock.json
      - uses: dopplerhq/cli-action@v3
      - name: Install dependencies
        working-directory: ops
        run: npm ci
      - name: Build production control plane
        working-directory: ops
        run: npx opennextjs-cloudflare build
      - name: Deploy production control plane
        working-directory: ops
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --command 'npx wrangler deploy'
      - name: End-to-end control-plane readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://platform.mallanet.org/api/health || echo 000)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "The Mallanet production control plane did not return 200"
          exit 1

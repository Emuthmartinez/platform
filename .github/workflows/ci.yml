name: CI

# PLATFORM ISOLATION (U6): this workflow is safe to run. It does not deploy
# Workers and it does not need Colombia Doppler tokens. The OpenAPI oasdiff
# gate is not on the bootstrap SHA; it arrives when U19 imports Phase A
# after those commits reach Colombia main.
#
# CI runs on both long-lived branches. `staging` matters as much as `main`
# here: the documented flow is work-branch -> PR into `staging` -> PR
# `staging` -> `main`, so a trigger scoped to `main` alone meant the PR the
# team actually opens never ran CI at all.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Least-privilege default: every job gets read-only repo access and nothing
# else. No job in this workflow needs to write anything back to the repo,
# open issues/PRs, or touch packages/deployments.
permissions:
  contents: read

# Cancel superseded runs on the same ref/PR instead of piling them up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------
  # backend: Express/Drizzle API. No env vars needed for typecheck/build —
  # tsc only, nothing executes and nothing reads process.env at compile
  # time.
  # ---------------------------------------------------------------------
  build-backend:
    name: backend (lint + typecheck + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # Integridad del journal de migraciones. No toca la base ni necesita
      # secretos, asi que puede gatear CADA PR.
      #
      # Dos ramas que generan migracion en paralelo producen dos `0003_*.sql` y
      # dos entradas con idx 3; git resuelve el JSON como texto y el journal
      # queda roto. Peor: si comparten el `when`, aplicar una marca la otra como
      # aplicada y esa migracion NO CORRE NUNCA, en silencio. Ya hubo una
      # colision real entre main y feat/family-search-identity (2026-08-11).
      - name: Journal de migraciones
        working-directory: backend
        run: npm run check:migration-journal

      - name: Build
        working-directory: backend
        run: npm run build

  # ---------------------------------------------------------------------
  # frontend: public Next.js site. `next build` prerenders pages, which
  # imports next.config.ts / lib code that reads NEXT_PUBLIC_* at build
  # time — those need SOME value present or the build behaves differently
  # than a real deploy (e.g. CSP connect-src omitting origins). None of
  # this reaches a real network service at build time (verified locally:
  # build succeeds against these fake values with no backend running).
  # ---------------------------------------------------------------------
  build-frontend:
    name: frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_URL: "https://api.example.org"
      NEXT_PUBLIC_ASSET_PREFIX: ""
      NEXT_PUBLIC_R2_PUBLIC_BASE: "https://cdn.example.org"
      NEXT_PUBLIC_SITE_APEX_DOMAIN: "example.org"
      NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-XXXXXXXXXX"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      NEXT_PUBLIC_STRIPE_DONATION_URL: "https://donate.example.org"
      NEXT_PUBLIC_RESPONSEGRID_SLUG: "example-slug"
      NEXT_PUBLIC_RESPONSEGRID_WHATSAPP_URL: "https://example.org/chat"
      NEXT_PUBLIC_ACOPIO_DEFAULT_COUNTRY: "XX"
      NEXT_PUBLIC_EXPENSES_URL: "https://expenses.example.org"
      NEXT_PUBLIC_OPENPANEL_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
      NEXT_PUBLIC_OPENPANEL_DASHBOARD_URL: "https://analytics.example.org"
      NEXT_PUBLIC_OPENPANEL_PRODUCTION_HOST: "https://analytics.example.org"
      NEXT_PUBLIC_PROPOSAL_VARIANT: "default"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------
  # offline-build-frontend: guardia contra dependencias de RED en tiempo de
  # build del frontend.
  #
  # Por que existe: `next/font/google` descargaba los .woff2 durante
  # `next build`. Un parpadeo de red hablando con Google tumbaba el build
  # entero — paso de verdad (CI 31429921516 en `main`, 2026-08-10) con una
  # cascada de `module-not-found` que PARECE un error de codigo. Y como
  # `deploy-frontend.yml` despliega a produccion en cada push a `main`, el
  # mismo parpadeo tumba un despliegue de un sitio de emergencia.
  #
  # Las fuentes ya estan auto-alojadas (frontend/app/fonts/), asi que hoy el
  # build no necesita red. Este job CONGELA esa propiedad: si alguien vuelve a
  # meter `next/font/google` — o cualquier otra descarga en tiempo de build —
  # se cae AQUI, en un job cuyo nombre dice exactamente que paso, en vez de
  # caerse dentro de un despliegue a produccion.
  #
  # `npm ci` corre CON red (bajar dependencias es legitimo); solo el `build`
  # se ejecuta aislado, dentro de un namespace de red sin interfaces externas.
  # ---------------------------------------------------------------------
  offline-build-frontend:
    name: frontend (build sin red)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Mismos NEXT_PUBLIC_* que `build-frontend` (ver arriba): el build los
      # inlinea, y con valores distintos no estariamos probando el mismo build.
      # GitHub Actions no soporta anclas YAML, de ahi la duplicacion.
      NEXT_PUBLIC_API_URL: "https://api.example.org"
      NEXT_PUBLIC_ASSET_PREFIX: ""
      NEXT_PUBLIC_R2_PUBLIC_BASE: "https://cdn.example.org"
      NEXT_PUBLIC_SITE_APEX_DOMAIN: "example.org"
      NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-XXXXXXXXXX"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      NEXT_PUBLIC_STRIPE_DONATION_URL: "https://donate.example.org"
      NEXT_PUBLIC_RESPONSEGRID_SLUG: "example-slug"
      NEXT_PUBLIC_RESPONSEGRID_WHATSAPP_URL: "https://example.org/chat"
      NEXT_PUBLIC_ACOPIO_DEFAULT_COUNTRY: "XX"
      NEXT_PUBLIC_EXPENSES_URL: "https://expenses.example.org"
      NEXT_PUBLIC_OPENPANEL_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
      NEXT_PUBLIC_OPENPANEL_DASHBOARD_URL: "https://analytics.example.org"
      NEXT_PUBLIC_OPENPANEL_PRODUCTION_HOST: "https://analytics.example.org"
      NEXT_PUBLIC_PROPOSAL_VARIANT: "default"
      # Next hace ping a telemetry.nextjs.org. Sin apagarlo, este job podria
      # fallar por telemetria y no por una dependencia real — justo el tipo de
      # falso positivo que esta guardia existe para eliminar.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Con red: bajar dependencias es una dependencia de red legitima y
      # esperada. Lo que no puede depender de la red es el `build`.
      - name: Install dependencies (con red)
        working-directory: frontend
        run: npm ci

      - name: Build sin acceso a la red
        working-directory: frontend
        run: |
          # `unshare --net` crea un namespace de red sin ninguna interfaz
          # externa: dentro no hay salida a Internet ni DNS. `lo` se levanta
          # porque alguna herramienta puede querer loopback.
          #
          # `sudo -E env "PATH=$PATH"`: sudo resetea PATH por `secure_path`,
          # y sin esto no se encuentra el node que instalo setup-node.
          sudo -E env "PATH=$PATH" unshare --net -- \
            bash -euo pipefail -c '
              ip link set lo up

              # CONTROL POSITIVO. Una guardia que no puede fallar es
              # decorativa: si el aislamiento dejara de funcionar (cambio de
              # runner, de kernel, de permisos), el build pasaria con red y
              # este job daria un visto bueno falso PARA SIEMPRE. Asi que
              # primero se comprueba que de verdad NO hay red.
              if curl -sS --max-time 10 -o /dev/null https://fonts.gstatic.com; then
                echo "::error::El aislamiento de red no funciona: se alcanzo fonts.gstatic.com desde dentro del namespace. Esta guardia no esta probando nada."
                exit 1
              fi
              echo "Aislamiento verificado: sin salida a Internet dentro del namespace."

              npm run build
            '

      - name: Que significa si este job falla
        if: failure()
        run: |
          echo "::error::El build del frontend necesito RED. Casi siempre es un \`next/font/google\` (u otra descarga en tiempo de build) que volvio a colarse. Auto-aloja el recurso — mira frontend/app/fonts/README.md — en vez de relajar esta guardia: main despliega a produccion sin aprobacion."

  # ---------------------------------------------------------------------
  # admin: internal Next.js panel. Verified locally that `next build`
  # succeeds with zero env vars set (every server-only var it reads has a
  # safe fallback), so nothing extra is injected here.
  # ---------------------------------------------------------------------
  build-admin:
    name: admin (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Lint
        working-directory: admin
        run: npm run lint

      - name: Typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Test
        working-directory: admin
        run: npm test

      - name: Build
        working-directory: admin
        run: npm run build

  # ---------------------------------------------------------------------
  # test-backend: the backend suite is INTEGRATION tests, not unit tests —
  # backend/vitest.config.ts sets fileParallelism:false precisely because
  # every file shares one real Postgres and one real Valkey. Run without
  # them and 38 tests fail on connection errors, which is why this needs a
  # job of its own with service containers rather than a step in
  # build-backend.
  #
  # Image versions and credentials mirror docker-compose.yml so local and
  # CI agree; test/helpers.ts already defaults to exactly these URLs.
  # ---------------------------------------------------------------------
  test-backend:
    name: backend (integration tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: mapa_app
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapa_app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: "postgres://mapa_app:localdev@localhost:5432/app"
      VALKEY_URL: "redis://localhost:6379"
      # Synthetic, CI-only. Never real secrets — these exist so config/env.ts's
      # fail-fast checks pass against a throwaway database.
      JWT_SECRET: "ci-jwt-secret-not-for-prod-0123456789"
      PATIENT_DOCUMENT_HASH_SECRET: "ci-patient-document-hash-secret-0123456789"
      IP_SALT: "ci-ip-salt-not-for-prod-0123456789"
      TRUSTED_IP_HEADER: "cf-connecting-ip"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # MIGRATIONS_DIR defaults to a path relative to the process CWD, and
      # this runs from backend/ — without the override it would look for
      # backend/infra/db/migrations, which does not exist.
      - name: Apply migrations and seed auth
        working-directory: backend
        env:
          MIGRATIONS_DIR: "../infra/db/migrations"
        run: npm run migrate

      - name: Test
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------------
  # content-audit: blocks on any known real-deployment literal, banned
  # asset type, stray .env file, or suspicious git history. See
  # scripts/content-audit/README-equivalent comments in run.sh itself —
  # exit 0 here is NOT a clean bill of health, only "no known pattern
  # matched"; human review is still required before making the repo public.
  # ---------------------------------------------------------------------
  content-audit:
    name: content audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for the git-log sanity check)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run content audit
        run: bash scripts/content-audit/run.sh

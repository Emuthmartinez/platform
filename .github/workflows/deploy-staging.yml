name: Deploy staging

# PLATFORM ISOLATION: this clone must not deploy Colombia.
# Jobs run only when ENABLE_PLATFORM_DEPLOYS is the string true.
#
# Isolated staging Workers (mallanet.org custom domains):
#   API   -> mallanet-platform-api-staging (api-staging.mallanet.org)
#   ops   -> mallanet-platform-ops-staging (platform-staging.mallanet.org)
# Neon: mallanet-platform (hidden-cell), not Colombia.
#
# A DIFERENCIA DE PRODUCCION, AQUI EL BACKEND TAMBIEN SE DESPLIEGA SOLO.
# Es justo el motivo de existir de staging: si probar un cambio de API exigiera
# un paso manual, nadie lo probaria y volveriamos a estrenar en produccion.
# En `main` el backend es MANUAL: solo sale por workflow_dispatch
# (`deploy-backend.yml`), nunca con el merge.
#
# Se despliegan SIEMPRE la API y el control plane, sin filtro de rutas, para que
# staging no quede con un portal nuevo hablandole a una API vieja.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  backend:
    name: API de staging
    if: ${{ vars.ENABLE_PLATFORM_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # DOPPLER_TOKEN_STAGING apunta al config `stg`, cuyo DATABASE_URL es la
      # rama `staging` de Neon. Nunca la base de produccion.
      - name: Schema capability gate
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: doppler run --command 'npm run check:platform-schema'

      - name: Deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MOCKRAW }}
        run: npx wrangler deploy --env staging

  ops:
    name: Mallanet control plane staging
    if: ${{ vars.ENABLE_PLATFORM_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Detras del backend por el mismo motivo que el frontend: que el panel
    # nuevo hable con la API nueva.
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ops/package-lock.json
      - name: Instalar dependencias
        working-directory: ops
        run: npm ci

      - name: Build (OpenNext -> Workers)
        working-directory: ops
        run: npx opennextjs-cloudflare build

      - name: Deploy
        working-directory: ops
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MOCKRAW }}
        run: npx wrangler deploy --env staging

      - name: Smoke check
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://platform-staging.mallanet.org/api/health || echo 000)
            echo "intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "The Mallanet control plane did not return 200"
          exit 1

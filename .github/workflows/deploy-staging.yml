name: Deploy staging

# PLATFORM ISOLATION (U6): this clone must not deploy Colombia staging
# (staging.terremotocolombia.co). Jobs run only when ENABLE_PLATFORM_DEPLOYS
# is the string true, after isolated platform staging exists. Push to the
# staging branch never deploys from this clone.
#
# Despliega el entorno de STAGING completo:
#   frontend -> terremotocolombia-web-staging  (staging.terremotocolombia.co)
#   API      -> terremotocolombia-api-staging  (api-staging.terremotocolombia.co)
#   base     -> rama `staging` de Neon (datos aparte de produccion)
#
# A DIFERENCIA DE PRODUCCION, AQUI EL BACKEND TAMBIEN SE DESPLIEGA SOLO.
# Es justo el motivo de existir de staging: si probar un cambio de API exigiera
# un paso manual, nadie lo probaria y volveriamos a estrenar en produccion.
# En `main` el backend es MANUAL: solo sale por workflow_dispatch
# (`deploy-backend.yml`), nunca con el merge.
#
# Se despliegan SIEMPRE los dos tiers, sin filtro de rutas, para que staging no
# quede con un frontend nuevo hablandole a una API vieja.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  backend:
    name: API de staging
    if: ${{ vars.ENABLE_PLATFORM_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # DOPPLER_TOKEN_STAGING apunta al config `stg`, cuyo DATABASE_URL es la
      # rama `staging` de Neon. Nunca la base de produccion.
      - name: Deploy
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          doppler run --command '
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            npx wrangler deploy --env staging'

  admin:
    name: Admin de staging
    if: ${{ vars.ENABLE_PLATFORM_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Detras del backend por el mismo motivo que el frontend: que el panel
    # nuevo hable con la API nueva.
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: admin
        run: npm ci

      - name: Build (OpenNext -> Workers)
        working-directory: admin
        run: npx opennextjs-cloudflare build

      - name: Deploy
        working-directory: admin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          doppler run --command '
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            npx wrangler deploy --env staging'

      - name: Smoke check
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://admin-staging.terremotocolombia.co/api/health || echo 000)
            echo "intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "El panel de staging no devolvio 200"
          exit 1

  frontend:
    name: Frontend de staging
    if: ${{ vars.ENABLE_PLATFORM_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Detras del backend: el frontend se construye con NEXT_PUBLIC_API_URL
    # apuntando a la API de staging, asi que conviene que esa API ya sea la
    # nueva cuando el frontend salga.
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build (OpenNext -> Workers)
        working-directory: frontend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: doppler run -- npx opennextjs-cloudflare build

      - name: Deploy
        working-directory: frontend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          doppler run --command '
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            npx wrangler deploy --env staging --old-asset-ttl 86400'

      # Misma purga del SW que en produccion (ver deploy-frontend.yml): el
      # borde lo retiene y un deploy del service worker no llegaria nunca.
      - name: Purgar service worker del borde
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          doppler run --command '
            curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/494895363b65d50699864543d005238a/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN_COLOMBIA_SCOPED" \
              -H "Content-Type: application/json" \
              --data "{\"files\":[\"https://staging.terremotocolombia.co/sw.js\"]}"'

      - name: Smoke check
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            web=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://staging.terremotocolombia.co/ || echo 000)
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://api-staging.terremotocolombia.co/api/readyz || echo 000)
            echo "intento $i -> web:$web api:$api"
            [ "$web" = "200" ] && [ "$api" = "200" ] && exit 0
            sleep 10
          done
          echo "Staging no respondio 200 en web y api"
          exit 1
